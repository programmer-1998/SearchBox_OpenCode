          if (idx.length && input.value.trim() && !hits.length && !lastSearchHadApi) {
            lastSearchHadApi = true;
            scheduleSearch(120);
          }
        }).catch(function () {});
      })(s);
    }
  }, 1500);

  /* ========== 11b. DIAGNOSTIC probe (temporary) ========== */
  function diagSend(text) {
    try { console.log(text); } catch (_e) {}
    try {
      (origFetch || window.fetch)("http://127.0.0.1:48001/ocdiag", { method: "POST", mode: "no-cors", keepalive: true, body: text });
    } catch (_e) {}
  }
  (function diag() {
    var lg = [];
    lg.push("diag: window.api=" + (!!window.api) + " preloadFn=" + (!!window.api && typeof window.api.awaitInitialization === "function"));
    lg.push("diag: bootPath=" + window.location.pathname + " bootHash=" + window.location.hash);
    var diagQ = "پلاگین";
    var triesDiag = 0;

    function reportAll(s) {
      lg.push("diag: sid=" + s + " src=" + (lastSidSource || "-"));
      var titleEls = document.querySelectorAll("[data-session-title]");
      lg.push("diag: titleEls=" + titleEls.length);
      var rowR = null;
      for (var ti = 0; ti < titleEls.length && ti < 2; ti++) {
        var tr = titleEls[ti].getBoundingClientRect();
        lg.push("diag: title" + ti + " top=" + Math.round(tr.top) + " h=" + Math.round(tr.height) + " w=" + Math.round(tr.width) + " left=" + Math.round(tr.left));
        if (!rowR) rowR = toolbarRect(titleEls[ti]);
      }
      if (rowR) lg.push("diag: toolbar top=" + Math.round(rowR.top) + " left=" + Math.round(rowR.left) + " w=" + Math.round(rowR.width) + " h=" + Math.round(rowR.height));
      var bx = document.querySelector("#oc-find-chat-box");
      if (bx) { var br = bx.getBoundingClientRect(); lg.push("diag: box top=" + Math.round(br.top) + " cx=" + Math.round(br.left + br.width / 2) + " w=" + Math.round(br.width)); }
      lg.push("diag: mountedRows=" + document.querySelectorAll("[data-message-id]").length);
      diagSend(lg.join(" | "));

      (origFetch || window.fetch)(apiOrigin + "/api/session/" + encodeURIComponent(s) + "/history?limit=5&after=0", {
        headers: { Authorization: apiAuth }
      }).then(function (r) {
        return r.json().then(function (j) {
          var ev0 = j && j.data && j.data[0];
          diagSend("diag: historyHttp=" + r.status + " len=" + (j && j.data ? j.data.length : "-") + " hasMore=" + (j && j.hasMore) + " ev0Type=" + (ev0 && ev0.type) + " ev0Seq=" + (ev0 && ev0.seq) + " ev0Keys=" + (ev0 ? Object.keys(ev0).join(",") : "-"));
        });
      }).catch(function (e) { diagSend("diag: historyErr " + (e && e.message)); });

      (origFetch || window.fetch)(apiOrigin + "/session/" + encodeURIComponent(s) + "/message", {
        headers: { Authorization: apiAuth }
      }).then(function (r) {
        return r.text().then(function (tx) {
          var n = -1, roles = "";
          try {
            var j = JSON.parse(tx);
            var arr = Array.isArray(j) ? j : (j && Array.isArray(j.data) ? j.data : []);
            n = arr.length;
            roles = arr.slice(0, 3).map(function (it) { return (it && it.info && it.info.role) || "?"; }).join(",");
          } catch (_e3) {}
          diagSend("diag: v1Http=" + r.status + " v1Len=" + n + " roles=" + roles + " body=" + tx.slice(0, 120));
        });
      }).catch(function (e) { diagSend("diag: v1Err " + (e && e.message)); });

      buildIndex(s).then(function (idx) {
        var cnt = 0, cntU = 0, cntA = 0, i2, hay2, pp2;
        for (i2 = 0; i2 < idx.length; i2++) {
          hay2 = (idx[i2].text || "").toLowerCase();
          pp2 = 0;
          while ((pp2 = hay2.indexOf(diagQ, pp2)) >= 0) {
            cnt++;
            if (idx[i2].role === "user") cntU++; else cntA++;
            pp2 += diagQ.length;
          }
        }
        diagSend("diag: idxSrc=" + ((indexCache[s] && indexCache[s].src) || "-") + " idxMsgs=" + idx.length + " totalMatches(" + diagQ + ")=" + cnt + " user=" + cntU + " assistant=" + cntA);
      }).catch(function (e) { diagSend("diag: idxErr " + (e && e.message)); });

      (origFetch || window.fetch)(apiOrigin + "/api/session/" + encodeURIComponent(s) + "/message?limit=200&order=asc", {
        headers: { Authorization: apiAuth }
      }).then(function (r) {
        return r.text().then(function (tx) {
          var n = -1;
          try { var j = JSON.parse(tx); n = Array.isArray(j.data) ? j.data.length : -1; } catch (_e2) {}
          diagSend("diag: messageHttp=" + r.status + " messageDataLen=" + n + " body=" + tx.slice(0, 140));
        });
      }).catch(function (e) { diagSend("diag: messageErr " + (e && e.message)); });
    }

    (function wait() {
      triesDiag++;
      var s = sessionId();
      lg.push("diag: poll" + triesDiag + " path=" + window.location.pathname + " sid=" + s + " (" + (lastSidSource || "-") + ") origin=" + (apiOrigin || "-"));
      if (s && s !== "null" && apiOrigin && apiAuth) { reportAll(s); return; }
      if (triesDiag > 40) { diagSend(lg.join(" | diag: timeout")); return; }
      if (s && s !== "null" && (!apiOrigin || !apiAuth)) { tryPreload().catch(function () {}); }
      setTimeout(wait, 1500);
    })();
  })();

  /* ========== 12. Boot ========== */
  function boot() {
    (document.head || document.documentElement).appendChild(style);
    box.style.display = "none";
    updateStatus();
    mount();
    refreshVisibility();
    tryPreload().catch(tryFetchIntercept);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
